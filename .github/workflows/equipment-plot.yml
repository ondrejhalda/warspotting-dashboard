name: Create Equipment Plot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-plot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run equipment plot
        run: python equipment_plot.py

      - name: Commit plot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipment_weekly.html
          git diff --cached --quiet || git commit -m "Create equipment analysis plot"
          git push
