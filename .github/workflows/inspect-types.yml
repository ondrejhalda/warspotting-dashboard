name: Inspect WarSpotting Types

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas

      - name: Inspect equipment types
        run: python inspect_types.py
