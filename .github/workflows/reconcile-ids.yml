name: WarSpotting ID Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run targeted reconciliation
        run: python reconcile_ids.py

      - name: Upload reconciliation result
        uses: actions/upload-artifact@v4
        with:
          name: warspotting-id-reconciliation
          path: reconcile_ids.csv
