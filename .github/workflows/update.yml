name: Update WarSpotting Analytics

on:
  schedule:
    # Daily incremental update.
    - cron: "0 6 * * *"

    # Weekly full source reconciliation.
    - cron: "0 7 * * 0"

  workflow_dispatch:
    inputs:
      full_reconciliation:
        description: "Run full source reconciliation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: warspotting-update
  cancel-in-progress: false

jobs:
  update-project:
    runs-on: ubuntu-latest

    env:
      FULL_SOURCE_RECONCILIATION: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full_reconciliation) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update WarSpotting data and dashboard
        run: python dashboard.py

      - name: Verify shared raw dataset
        run: test -f warspotting_raw.csv

      - name: Generate equipment Plotly chart
        run: python equipment_plot.py

      - name: Verify equipment chart
        run: test -f equipment_weekly.html

      - name: Verify weekly equipment data
        run: test -f weekly_equipment_losses.csv

      - name: Verify data quality report
        run: test -f data_quality.json

      - name: Verify sync quality report
        if: env.FULL_SOURCE_RECONCILIATION == 'true'
        run: test -f sync_quality.json

      - name: Commit updated data and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add warspotting_raw.csv
          git add weekly_losses.csv
          git add weekly_equipment_losses.csv
          git add equipment_weekly.html
          git add data_quality.json
          git add dashboard.png

          if [ -f sync_quality.json ]; then
            git add sync_quality.json
          fi

          git diff --cached --quiet || git commit -m "Update WarSpotting data and equipment plot"
          git push
